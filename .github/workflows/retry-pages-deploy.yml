name: Retry failed Pages deploy

"on":
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  retry:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed jobs once
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            core.info(`Requesting rerun of failed jobs for workflow run ${runId}`);
            try {
              await github.request('POST /repos/{owner}/{repo}/actions/runs/{run_id}/rerun-failed-jobs', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
              });
            } catch (error) {
              core.setFailed(`Failed to request rerun for workflow run ${runId}: ${error.message}`);
            }
